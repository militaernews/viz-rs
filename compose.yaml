services:
  db:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - 6333
      - 6334
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage
  app:
    build:
      context: ./service
      target: runtime
    environment:
      - PORT=80
    ports:
      - "127.0.0.1:8080:3011"




configs:
  qdrant_config:
    content: |
      log_level: INFO      
