[package]
name = "viz-rs"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 0

[profile.dev.package.sqlx-macros]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["multipart", "macros", "ws"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
tower-http = { version = "0.6.11", features = ["trace", "cors", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

thiserror = "2.0.20"
dotenvy = "0.15.7"
#rust-bert = "0.23"
image = "0.25.10"
tch = { version = "0.20.0", features = [] }
anyhow = "1.0.104"
http = "1.5.0"
qdrant-client = "1.19.0"

log = "0.4.34"
simple_logger = "5.2.0"

grammers-client = { git = "https://codeberg.org/Lonami/grammers.git" }
grammers-mtsender = { git = "https://codeberg.org/Lonami/grammers.git" }
grammers-session = { git = "https://codeberg.org/Lonami/grammers.git", features = ["sqlite-storage"] }
sqlx = { version = "0.8.6", features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "migrate",
    "time",
] }

futures = "0.3.34"
base64 = "0.22.1"
