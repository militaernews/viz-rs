[package]
name = "viz-rs"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 0

[profile.dev.package.sqlx-macros]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[dependencies]
tokio = { version = "1.47.0", features = ["full"] }
axum = { version = "0.8.4", features = ["multipart", "macros", "ws"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
chrono = { version = "0.4.41", features = ["serde"] }
uuid = { version = "1.17.0", features = ["serde", "v4"] }
tower-http = { version = "0.6.6", features = ["trace", "cors", "timeout"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

thiserror = "2.0.12"
dotenvy = "0.15.7"
#rust-bert = "0.23"
image = "0.25.6"
tch = { version = "0.20.0", features = [] }
anyhow = "1.0.98"
http = "1.3.1"
qdrant-client = "1.15.0"

log = "0.4.27"
simple_logger = "5.0.0"

grammers-client = { git = "https://github.com/Lonami/grammers.git", rev = "19b81d1" }
sqlx = { version = "0.8.6", features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "migrate",
    "time",
] }

futures = "0.3.31"
base64 = "0.22.1"
